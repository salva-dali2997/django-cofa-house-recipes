# Self-managed Postgres. No public IP is allocated for this app — the
# recipes app reaches it over a private Flycast address at cofa-house-db.flycast:5432.
# Flycast routes through the Fly Proxy, which lets the machine auto stop/start;
# connecting via .internal would bypass the proxy and never wake it.
# Deploy with: fly deploy -c postgres/fly.toml
app = "cofa-house-db"
primary_region = "iad"
# Give Postgres time to finish a clean shutdown when auto-stopped.
kill_timeout = 30

[build]
  image = "postgres:16"

[env]
  PGDATA = "/var/lib/postgresql/data/pgdata"

[[services]]
  internal_port = 5432
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # No handlers: raw TCP passthrough so the proxy doesn't speak HTTP/TLS to Postgres.
  [[services.ports]]
    port = 5432

[[mounts]]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
