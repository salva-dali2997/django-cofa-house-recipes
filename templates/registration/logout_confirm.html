{% extends "base.html" %}

{% block content %}

<div class="mx-auto max-w-sm rounded-xl shadow-md bg-sage p-10 mt-20 text-center flex flex-col gap-y-4 items-center">
  <p class="text-2xl text-cream text-outline">Do you want to log out?</p>
  <form method="POST" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit" class="bg-peach hover:bg-rust hover:text-cream py-2 px-4 rounded-full">Log Out</button>
  </form>
</div>

{% endblock %}
